name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    # PostgreSQL de verdade para os testes de banco (tests/test_database.py)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: docmind
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Os testes usam um modelo falso: nenhuma chave de API é necessária.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar sintaxe de todos os arquivos
        run: python -m compileall -q app.py main.py DocMindAPI.py docmind database tests

      - name: Rodar os testes
        run: pytest -v
